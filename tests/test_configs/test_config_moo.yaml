# MultiObjective Optimization config
optimization:
    objective: -RMSE, -Meanyyy
    metrics:
        # List all of your metrics here,
        # only list multiple objectives for a multi objective optimization
        RMSE:
            metric: RMSE  # names default to the metric itself if not specified
            metric_type: boa
        Meanyyy:
            name: Meanyyy
            metric: Mean
            metric_type: boa
    outcome_constraints: []
orchestrator:
    total_trials: 10
script_options:
    exp_name: "test_experiment"

parameters:
    x1:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x2:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x3:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x4:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x5:
        type: fixed
        value: .5
        parameter_type: float

parameter_constraints:
    - x2 + x1 >= .1
    - x2 + x1 + .6*x1 <= .6

model_options:
    model_specific_options:
        - 1
        - 2
        - 3
