orchestrator:
    total_trials: 10
    
parameters:
    x1:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x2:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x3:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x4:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x5: 
        type: range
        bounds: [ 0, 1 ]
        parameter_type: float
    x6:
        type: range
        bounds: [0, 1]
        parameter_type: float


# options only needed by the model and not BOA
# You can put anything here that your model might need
model_options:
    input_size: 15

script_options:
    wrapper_path: ../../boa/scripts/script_wrappers.py
    wrapper_name: BraninWrapper