
optimization:
    objective: -hartmann6 + 2*score
    metrics:
        hartmann6:
            metric_type: synthetic
        score:
            metric_type: passthrough


generation_strategy:
    method: fast
    initialization_budget: 10
    initialization_random_seed: 42
    initialize_with_center: True
    use_existing_trials_for_initialization: True
    # min_observed_initialization_trials: max(1, initialization_budget // 2)
    allow_exceeding_initialization_budget: False
    # Misc options
    # torch_device: None
    simplify_parameter_changes: False

