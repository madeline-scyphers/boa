optimization:
    objective: -rmse
    tracking_metrics: [mean]
    metrics:
        rmse:
            name: rmse
            metric: RootMeanSquaredError
            metric_type: boa
        # We can mark metrics as info only just so we can track their results later
        # without it impacting our optimization
        mean:
            name: mean
            metric: Mean
            metric_type: boa

parameters:
    x1:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x2:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x3:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x4:
        type: range
        bounds: [0, 1]
        parameter_type: float

    x5:
        type: fixed
        value: .5
        parameter_type: float

parameter_constraints:
    - x2 + x1 >= .1
    - x2 + x1 + .6*x1 <= .6

# Here we explicitly define a generation strategy
# for our trials.
# This can always be done, but if left off,
# Will be autoselected.
# Here we say we want for first 5 trials
# To be a random sobol survey,
# and then the rest be Gaussian process expected improvement
generation_strategy:
    method: fast
    initialization_budget: 5

orchestrator:
    total_trials: 10
    global_stopping_strategy:
        type: improvement
        min_trials: 7
        window_size: 3
        improvement_bar: 0.01
