# Single objective optimization config
optimization:
    objective: -Mean
    tracking_metrics: [RMSE]
    metrics:
        Mean:
            metric: mean
            name: Mean
            metric_type: boa
        RMSE:
            metric: RMSE
            metric_type: boa
generation_strategy:
    method: fast
    initialization_budget: 5
n_trials: 10

parameters:
    x0:
        type: range
        bounds: [-5.0, 10.0]
        parameter_type: float
    x1:
        type: fixed
        value: 10
        parameter_type: int

script_options:
#    wrapper_path: ./wrapper.py  # This is the default
    wrapper_name: WrapperStandAlone  # This defaults to "Wrapper", but we change it here to whatever we called our Wrapper class
