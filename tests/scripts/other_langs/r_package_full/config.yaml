optimization:
    objective: metric
    metrics:
        metric:
            name: metric
            metric: mean
            metric_type: boa
            param_names: [ x0, x1, x2, x3, x4, x5 ]
            properties:
                anything: "you want"
generation_strategy:
    method: fast
    initialization_budget: 5
orchestrator:
    total_trials: 15
    tolerated_trial_failure_rate: 0.8

parameters:
    x0:
        'bounds': [ 0, 1 ]
        'type': 'range'
        'parameter_type': 'float'
    x1:
        'bounds': [ 0, 1]
        'type': 'range'
        'parameter_type': 'float'
    x2:
        'bounds': [ 0, 1 ]
        'type': 'range'
        'parameter_type': 'float'
    x3:
        'bounds': [ 0, 1]
        'type': 'range'
        'parameter_type': 'float'
    x4:
        'bounds': [ 0, 1 ]
        'type': 'range'
        'parameter_type': 'float'
    x5:
        'bounds': [ 0, 1]
        'type': 'range'
        'parameter_type': 'float'

script_options:
    write_configs: Rscript write_configs.R
    run_model: Rscript run_model.R
    set_trial_status: Rscript set_trial_status.R
    fetch_trial_data: Rscript fetch_trial_data.R

model_options:
    input_size: 15
    model_dir: .
