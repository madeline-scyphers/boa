# MultiObjective Optimization config
optimization:
    objective: -branin, currin
    metrics:
        branin:
            name: branin
            metric_type: passthrough
            lower_is_better: False
            noise_sd: 0
        currin:
            name: currin
            metric_type: passthrough
            lower_is_better: False
            noise_sd: 0

n_trials: 30

parameters:
    x0:
        type: range
        bounds: [0, 1]
        parameter_type: float
    x1:
        type: range
        bounds: [0, 1]
        parameter_type: float

script_options:
    exp_name: "moo_run"
    wrapper_name: WrapperMoo
